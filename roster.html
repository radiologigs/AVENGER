<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster Personel CNSD & EME JATSC</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    margin:20px;
}

.container{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:8px;
    box-sizing:border-box;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.table-container{
    overflow-x:auto;
    margin-top:20px;
}

table{
    border-collapse:collapse;
    min-width:1200px;
    background:white;
}

th,td{
    border:1px solid #999;
    padding:6px;
    text-align:center;
    white-space:nowrap;
}

th{
    background:#e9ecef;
}

.ps{
    background:#81d4fa;
}

.p{
    background:#aed581;
}

.s{
    background:#ffcc80;
}

.m{
    background:#90caf9;
}

.r{
    background:#ffffff;
}

.sticky{
    position:sticky;
    left:0;
    background:white;
    z-index:2;
}

.sticky2{
    position:sticky;
    left:150px;
    background:white;
    z-index:2;
}

.sticky3{
    position:sticky;
    left:250px;
    background:white;
    z-index:2;
}

</style>
</head>
<body>

<div class="container">

<h2>Roster Personel CNSD & EME JATSC</h2>

<div class="form-grid">

<div>
<label>Nama Pegawai</label>
<select id="nama" onchange="isiData()">
<option value="">-- Pilih Pegawai --</option>
</select>
</div>

<div>
<label>NIK</label>
<input type="text" id="nik" readonly>
</div>

<div>
<label>Unit</label>
<select id="unit">
<option>Radkom</option>
<option>Radtel</option>
<option>Navigasi</option>
<option>Surveillance</option>
<option>AMSC</option>
<option>RDPS</option>
</select>
</div>

<div>
<label>Bulan</label>
<select id="bulan">
<option value="0">Januari</option>
<option value="1">Februari</option>
<option value="2">Maret</option>
<option value="3">April</option>
<option value="4">Mei</option>
<option value="5">Juni</option>
<option value="6">Juli</option>
<option value="7">Agustus</option>
<option value="8">September</option>
<option value="9">Oktober</option>
<option value="10">November</option>
<option value="11">Desember</option>
</select>
</div>

<div>
<label>Tahun</label>
<input type="number" id="tahun" value="2026">
</div>

<div>
<label>Pattern Shift</label>
<select id="shift">
<option>PS-M-R-R</option>
<option>P-S-M-R-R</option>
<option>PS-MN-R-R</option>
<option>P-S-MN-R-R</option>
</select>
</div>

</div>

<button onclick="tambahRoster()">
Tambah Ke Roster
</button>

<div class="table-container">

<table id="tblRoster">

<thead>
<tr>
<th class="sticky">Nama</th>
<th class="sticky2">NIK</th>
<th class="sticky3">Unit</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

</div>

</div>

<script>

// DATA PEGAWAI
const pegawai = [

{
nama:"ARI WEBE",
nik:"1987001"
},

{
nama:"BUDI",
nik:"1987002"
},

{
nama:"JOKO",
nik:"1987003"
},

{
nama:"RUDI",
nik:"1987004"
}

];

// isi dropdown
const dropdown = document.getElementById("nama");

pegawai.forEach(p=>{

let opt = document.createElement("option");

opt.value = p.nama;
opt.textContent = p.nama;

dropdown.appendChild(opt);

});

// autofill nik
function isiData(){

let nama = document.getElementById("nama").value;

let data = pegawai.find(
x => x.nama === nama
);

document.getElementById("nik").value =
data ? data.nik : "";

}

// generate header tanggal
function generateHeader(jumlahHari){

let html = `
<tr>
<th class="sticky">Nama</th>
<th class="sticky2">NIK</th>
<th class="sticky3">Unit</th>
`;

for(let i=1;i<=jumlahHari;i++){

html += `<th>${i}</th>`;

}

html += "</tr>";

document.querySelector("#tblRoster thead").innerHTML =
html;

}

// tambah roster
function tambahRoster(){

let nama =
document.getElementById("nama").value;

let nik =
document.getElementById("nik").value;

let unit =
document.getElementById("unit").value;

let bulan =
parseInt(document.getElementById("bulan").value);

let tahun =
parseInt(document.getElementById("tahun").value);

let pattern =
document.getElementById("shift").value;

if(!nama){

alert("Pilih pegawai");

return;

}

// jumlah hari dalam bulan
let jumlahHari =
new Date(tahun, bulan + 1, 0).getDate();

generateHeader(jumlahHari);

// pecah pattern
let pola =
pattern.split("-");

let row = `
<tr>
<td class="sticky">${nama}</td>
<td class="sticky2">${nik}</td>
<td class="sticky3">${unit}</td>
`;

for(let i=0;i<jumlahHari;i++){

let shift =
pola[i % pola.length];

let cls = shift.toLowerCase();

row += `
<td class="${cls}">
${shift}
</td>
`;

}

row += "</tr>";

document.querySelector("#tblRoster tbody")
.insertAdjacentHTML(
"beforeend",
row
);

}

</script>

</body>
</html>
